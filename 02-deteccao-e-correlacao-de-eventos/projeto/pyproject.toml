[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bb-aiops-triagem"
version = "0.2.0"
description = "Triagem local de sinais da jornada Pix fictícia"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph==1.2.19",
  "pydantic==2.14.2",
  "pandas==2.3.3",
  "ipykernel==7.4.0",
  "nbformat==5.11.1",
  "nbclient==0.11.0",
  "pytest==9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
