<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310"><rect width="760" height="310" fill="white"/><g font-family="Arial,sans-serif" fill="#22222b"><text x="24" y="34" font-size="22" font-weight="700">Mesmos 3 bilhões de pesos, menos bits por peso</text><text x="24" y="62" font-size="15" fill="#62616b">Exemplo idealizado: somente pesos, em GB decimal.</text><text x="24" y="113" font-size="18">16 bits</text><rect x="130" y="88" width="462" height="36" rx="4" fill="#262333"/><text x="604" y="113" font-size="18" font-weight="700">6 GB</text><text x="24" y="171" font-size="18">8 bits</text><rect x="130" y="146" width="231" height="36" rx="4" fill="#928999"/><text x="373" y="171" font-size="18" font-weight="700">3 GB</text><text x="24" y="229" font-size="18">4 bits</text><rect x="130" y="204" width="115.5" height="36" rx="4" fill="#ed0755"/><text x="257.5" y="229" font-size="18" font-weight="700">1,5 GB</text><text x="24" y="286" font-size="15" fill="#62616b">Não representa RAM/VRAM total nem o tamanho exato de um arquivo Q4_K_M.</text></g></svg>