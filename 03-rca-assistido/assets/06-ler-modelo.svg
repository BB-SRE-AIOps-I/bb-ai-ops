<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="246" viewBox="0 0 1000 246"><rect width="1000" height="246" fill="white"/><g font-family="Arial,sans-serif"><rect x="12" y="22" width="226" height="159" rx="8" fill="#ed0755"/><text x="26" y="49" font-size="14" font-weight="700" fill="white">NOME NO CATÁLOGO</text><text x="26" y="88" font-size="24" font-weight="700" fill="white">qwen2.5:7b</text><text x="26" y="118" font-size="17" font-weight="400" fill="white">Modelo selecionado</text><text x="26" y="148" font-size="17" font-weight="400" fill="white">neste tutorial.</text><path d="M242 102 h15 m-5 -5 l5 5 -5 5" stroke="#ed0755" stroke-width="2" fill="none"/><rect x="262" y="22" width="226" height="159" rx="8" fill="#f5f3f7"/><text x="276" y="49" font-size="14" font-weight="700" fill="#262333">LEIA AS PARTES</text><text x="276" y="88" font-size="17" font-weight="400" fill="#262333">qwen2.5: família / versão</text><text x="276" y="118" font-size="17" font-weight="400" fill="#262333">7b: tag da variante</text><text x="276" y="148" font-size="17" font-weight="400" fill="#262333">B = bilhão.</text><path d="M492 102 h15 m-5 -5 l5 5 -5 5" stroke="#ed0755" stroke-width="2" fill="none"/><rect x="512" y="22" width="226" height="159" rx="8" fill="#f5f3f7"/><text x="526" y="49" font-size="14" font-weight="700" fill="#262333">DETALHES DO ARQUIVO</text><text x="526" y="88" font-size="17" font-weight="400" fill="#262333">7,62B parâmetros</text><text x="526" y="118" font-size="17" font-weight="400" fill="#262333">Quantização Q4_K_M</text><text x="526" y="148" font-size="17" font-weight="400" fill="#262333">Download: 4,7 GB</text><path d="M742 102 h15 m-5 -5 l5 5 -5 5" stroke="#ed0755" stroke-width="2" fill="none"/><rect x="762" y="22" width="226" height="159" rx="8" fill="#f5f3f7"/><text x="776" y="49" font-size="14" font-weight="700" fill="#262333">CONFIRA NA MÁQUINA</text><text x="776" y="88" font-size="17" font-weight="400" fill="#262333">ollama show qwen2.5:7b</text><text x="776" y="118" font-size="17" font-weight="400" fill="#262333">ollama list</text><text x="776" y="148" font-size="17" font-weight="400" fill="#262333">Veja o artefato instalado.</text><rect x="12" y="198" width="976" height="36" rx="4" fill="#fff0f6"/><text x="26" y="222" font-size="17" fill="#262333">O tamanho do download não representa toda a RAM ou VRAM necessária para executar.</text></g></svg>