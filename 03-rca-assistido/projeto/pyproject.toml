[project]
name = "bb-aiops-rca"
version = "0.1.0"
description = "RCA assistido com evidências, RAG e revisão humana"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph==1.2.19", "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic==2.14.2", "openai>=2,<3", "httpx==0.28.1",
  "python-dotenv>=1,<2", "chromadb>=1,<2", "fastembed>=0.7,<1",
  "pandas==2.3.3", "ipykernel==7.4.0", "nbformat==5.11.1",
  "nbclient==0.11.0", "pytest==9.2.0", "pillow>=11,<13",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/aiops_rca"]
[tool.pytest.ini_options]
testpaths = ["tests"]
