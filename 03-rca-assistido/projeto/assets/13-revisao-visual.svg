<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="245" viewBox="0 0 1000 245"><rect width="1000" height="245" fill="white"/><g font-family="Arial,sans-serif"><rect x="12.0" y="14" width="309.3333333333333" height="174" rx="8" fill="#ed0755"/><text x="28.0" y="40" font-size="14" font-weight="700" fill="white">PRODUZIR</text><text x="28.0" y="73" font-size="23" font-weight="700" fill="white">Análise e postmortem</text><text x="28.0" y="108" font-size="18" font-weight="400" fill="white">Modelo gera hipóteses</text><text x="28.0" y="135" font-size="18" font-weight="400" fill="white">Grafo organiza o rascunho</text><path d="M325.3333333333333 102 h15 m-5 -5 l5 5 -5 5" fill="none" stroke="#ed0755" stroke-width="2"/><rect x="345.3333333333333" y="14" width="309.3333333333333" height="174" rx="8" fill="#f5f3f7"/><text x="361.3333333333333" y="40" font-size="14" font-weight="700" fill="#262333">PAUSAR</text><text x="361.3333333333333" y="73" font-size="23" font-weight="700" fill="#262333">Guardar para revisão</text><text x="361.3333333333333" y="108" font-size="18" font-weight="400" fill="#262333">SQLite persiste a execução</text><text x="361.3333333333333" y="135" font-size="18" font-weight="400" fill="#262333">Consultar não chama o modelo</text><path d="M658.6666666666666 102 h15 m-5 -5 l5 5 -5 5" fill="none" stroke="#ed0755" stroke-width="2"/><rect x="678.6666666666666" y="14" width="309.3333333333333" height="174" rx="8" fill="#f5f3f7"/><text x="694.6666666666666" y="40" font-size="14" font-weight="700" fill="#262333">DECIDIR</text><text x="694.6666666666666" y="73" font-size="23" font-weight="700" fill="#262333">Ler a versão e escolher</text><text x="694.6666666666666" y="108" font-size="18" font-weight="400" fill="#262333">Aprovar: finalizar a versão</text><text x="694.6666666666666" y="135" font-size="18" font-weight="400" fill="#262333">Revisar: nova análise + pausa</text><rect x="12" y="202" width="976" height="32" rx="4" fill="#fff0f6"/><text x="26" y="224" font-size="17" fill="#262333">As ações do postmortem são propostas. Nenhuma mudança de infraestrutura é executada.</text></g></svg>