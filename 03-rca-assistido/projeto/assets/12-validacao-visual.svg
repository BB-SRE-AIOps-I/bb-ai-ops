<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="245" viewBox="0 0 1000 245"><rect width="1000" height="245" fill="white"/><g font-family="Arial,sans-serif"><rect x="12.0" y="14" width="309.3333333333333" height="174" rx="8" fill="#ed0755"/><text x="28.0" y="40" font-size="14" font-weight="700" fill="white">ESTRUTURA</text><text x="28.0" y="73" font-size="23" font-weight="700" fill="white">Formato esperado</text><text x="28.0" y="108" font-size="18" font-weight="400" fill="white">Pydantic confere campos e tipos</text><text x="28.0" y="135" font-size="18" font-weight="400" fill="white">A resposta segue o contrato?</text><path d="M325.3333333333333 102 h15 m-5 -5 l5 5 -5 5" fill="none" stroke="#ed0755" stroke-width="2"/><rect x="345.3333333333333" y="14" width="309.3333333333333" height="174" rx="8" fill="#f5f3f7"/><text x="361.3333333333333" y="40" font-size="14" font-weight="700" fill="#262333">REFERÊNCIAS</text><text x="361.3333333333333" y="73" font-size="23" font-weight="700" fill="#262333">Fontes existentes</text><text x="361.3333333333333" y="108" font-size="18" font-weight="400" fill="#262333">Python confere os IDs enviados</text><text x="361.3333333333333" y="135" font-size="18" font-weight="400" fill="#262333">O modelo citou uma fonte válida?</text><path d="M658.6666666666666 102 h15 m-5 -5 l5 5 -5 5" fill="none" stroke="#ed0755" stroke-width="2"/><rect x="678.6666666666666" y="14" width="309.3333333333333" height="174" rx="8" fill="#f5f3f7"/><text x="694.6666666666666" y="40" font-size="14" font-weight="700" fill="#262333">INTERPRETAÇÃO</text><text x="694.6666666666666" y="73" font-size="23" font-weight="700" fill="#262333">Sustentação da análise</text><text x="694.6666666666666" y="108" font-size="18" font-weight="400" fill="#262333">A pessoa lê a fonte e a afirmação</text><text x="694.6666666666666" y="135" font-size="18" font-weight="400" fill="#262333">Essa fonte sustenta a conclusão?</text><rect x="12" y="202" width="976" height="32" rx="4" fill="#fff0f6"/><text x="26" y="224" font-size="17" fill="#262333">Formato correto e IDs existentes não comprovam a interpretação nem a causa.</text></g></svg>