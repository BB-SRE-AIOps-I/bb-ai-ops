[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bb-aiops-laboratorio"
version = "0.1.0"
description = "Demonstração educacional de resumo de evidências, sem remediação."
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1.0,<2", "langchain-openai>=1.0,<2", "pydantic>=2.10,<3",
  "python-dotenv>=1,<2", "pandas>=2.2,<3", "ipykernel>=6,<8",
  "nbformat>=5,<6", "nbclient>=0.10,<1", "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
